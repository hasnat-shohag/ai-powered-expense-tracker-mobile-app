<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Archivo+Narrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE3CE;
    --ink:#2B1D12;
    --tint:#8A6A3E;
    --green:#14503C;
    --vermilion:#C8352A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:412px;height:915px;overflow:hidden}
  body{
    background:var(--paper);
    font-family:'Archivo Narrow',sans-serif;
    color:var(--ink);
    position:relative;
  }
  /* engraved paper tooth */
  body::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:40;
    background:
      repeating-linear-gradient(0deg, rgba(43,29,18,.045) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(43,29,18,.035) 0 1px, transparent 1px 3px);
  }
  .thread{
    position:absolute;left:34px;top:0;bottom:0;width:17px;z-index:5;
    background:repeating-linear-gradient(58deg, rgba(20,80,60,.5) 0 1.4px, transparent 1.4px 5px);
    border-left:1px solid rgba(20,80,60,.75);
    border-right:1px solid rgba(20,80,60,.75);
  }
  .inner{
    position:absolute;left:0;right:0;top:0;bottom:0;padding:0 26px 0 68px;z-index:10;
    /* engine-turned field: two crossed fine gratings, the way a note's ground is laid */
    background:
      repeating-linear-gradient(74deg, rgba(138,106,62,.11) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-74deg, rgba(138,106,62,.08) 0 1px, transparent 1px 11px);
  }

  /* ---- top rule + serial ---- */
  .toprule{display:flex;align-items:baseline;justify-content:space-between;padding-top:22px}
  .micro{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);opacity:.85}
  .micro.dim{opacity:.45}
  .rule{border:0;border-top:1px solid var(--ink);opacity:.55;margin-top:6px}
  .rule.thick{border-top:2.5px solid var(--ink);opacity:.9}
  .rule.dbl{border-top:1px solid var(--ink);box-shadow:0 2.5px 0 -1.5px var(--ink);opacity:.8;margin-top:7px}

  /* ---- field label row ---- */
  .fieldrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px}
  .fieldrow .micro{font-size:9px;letter-spacing:.3em}

  /* ---- the denomination ---- */
  .denomwrap{position:relative;margin-top:8px;height:470px}
  #rosette{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:400px;height:400px;z-index:0}
  .denom{
    position:relative;z-index:2;text-align:center;
    font-family:'Bodoni Moda',serif;font-weight:900;
    font-size:168px;line-height:.9;letter-spacing:-.02em;
    background:repeating-linear-gradient(46deg, var(--ink) 0 2.6px, rgba(43,29,18,.68) 2.6px 5.4px);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    padding-top:112px;
  }
  .cur{
    font-family:'Bodoni Moda',serif;font-weight:700;font-size:52px;
    vertical-align:baseline;line-height:1;margin-right:5px;
    color:var(--ink);-webkit-text-fill-color:currentColor;
  }
  .cap{
    position:relative;z-index:2;text-align:center;margin-top:22px;
    font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;opacity:.8;
  }
  .entryrule{position:relative;z-index:2;margin-top:24px;border-top:1px solid var(--ink);opacity:.5}

  /* ---- particulars ---- */
  .particulars{display:flex;justify-content:space-between;margin-top:30px}
  .particulars div{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase}
  .particulars .k{opacity:.5;font-size:8.5px;letter-spacing:.22em;display:block;margin-bottom:3px}

  /* ---- seals ---- */
  .seals{position:absolute;left:68px;right:26px;bottom:88px;display:flex;gap:10px}
  .seal{
    flex:1;height:92px;border:1.6px solid var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    position:relative;
  }
  .seal.on{border-color:var(--vermilion)}
  .seal.on .glyph{stroke:var(--vermilion)}
  .seal.on .lbl{color:var(--vermilion)}
  .seal.on::after{
    content:"";position:absolute;inset:4px;border:.8px solid var(--vermilion);opacity:.55;
  }
  .glyph{width:30px;height:30px;fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:square}
  .lbl{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink)}

  /* ---- foot ---- */
  .foot{position:absolute;left:68px;right:26px;bottom:30px;display:flex;justify-content:space-between;align-items:center}
  .foot .micro{font-size:8px;letter-spacing:.2em}
</style>
</head>
<body>
  <div class="thread"></div>

  <div class="inner">
    <div class="toprule">
      <span class="micro">Personal Issue · Dhaka</span>
      <span class="micro dim">Serial 000481</span>
    </div>
    <hr class="rule">

    <div class="fieldrow">
      <span class="micro">Amount</span>
      <span class="micro dim">Taka</span>
    </div>

    <div class="denomwrap">
      <svg id="rosette" viewBox="0 0 340 340" aria-hidden="true"></svg>
      <div class="denom"><span class="cur">৳</span>250</div>
      <div class="cap">Two Hundred Fifty Taka Only</div>
      <hr class="entryrule">
    </div>

    <div class="particulars">
      <div><span class="k">Particulars</span>Lunch · Biryani House</div>
      <div style="text-align:right"><span class="k">Date</span>25 Sep 2026</div>
    </div>

    <hr class="rule dbl" style="margin-top:20px">
  </div>

  <div class="seals">
    <div class="seal on">
      <svg class="glyph" viewBox="0 0 24 24"><path d="M4 19h16M6 19V7h12v12M9 7V4h6v3M10 11h4M10 15h4"/></svg>
      <span class="lbl">Type</span>
    </div>
    <div class="seal">
      <svg class="glyph" viewBox="0 0 24 24"><path d="M12 4v9M8.5 9.5a5 5 0 1 0 7 0"/><path d="M9 19h6"/></svg>
      <span class="lbl">Speak</span>
    </div>
    <div class="seal">
      <svg class="glyph" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13"/><circle cx="12" cy="13.5" r="3.4"/><path d="M8.5 7l1.3-2.4h4.4L15.5 7"/></svg>
      <span class="lbl">Photograph</span>
    </div>
  </div>

  <div class="foot">
    <span class="micro dim">Pending 02</span>
    <span class="micro dim">Issued under personal authority</span>
  </div>

<script>
// Guilloche rosette: rotated ellipses, the way a note's engine-turned ground is actually built.
(function(){
  const svg = document.getElementById('rosette');
  const cx = 170, cy = 170;
  const NS = 'http://www.w3.org/2000/svg';
  function ring(count, rx, ry, w, op, rot0){
    const g = document.createElementNS(NS,'g');
    for (let i=0;i<count;i++){
      const e = document.createElementNS(NS,'ellipse');
      e.setAttribute('cx',cx); e.setAttribute('cy',cy);
      e.setAttribute('rx',rx); e.setAttribute('ry',ry);
      e.setAttribute('fill','none');
      e.setAttribute('stroke','#8A6A3E');
      e.setAttribute('stroke-width',w);
      e.setAttribute('opacity',op);
      e.setAttribute('transform',`rotate(${rot0 + (180/count)*i} ${cx} ${cy})`);
      g.appendChild(e);
    }
    svg.appendChild(g);
  }
  ring(28, 166, 62, 0.5, .30, 0);
  ring(36, 150, 104, 0.4, .22, 3);
  ring(20, 130, 130, 0.45, .18, 1.5);
  ring(44, 168, 26, 0.35, .16, 0);
})();
</script>
</body>
</html>
